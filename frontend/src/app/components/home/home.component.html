<!-- Simple Hero Section -->
<section class="hero">
  <div class="container">
    <div class="hero-content text-center">
      <h1>Welcome to CivicPulse</h1>
      <p>Report civic issues and make your community better</p>
      <div class="hero-buttons">
        <button class="btn btn-primary" (click)="navigateToReportIssue()">Report Issue</button>
        <button class="btn btn-secondary" (click)="navigateToLogin()">Sign In</button>
      </div>
    </div>
  </div>
</section>

<!-- Features Section -->
<section class="features">
  <div class="container">
    <h2 class="text-center mb-5">How It Works</h2>
    <div class="row">
      <div class="col-md-4 mb-4">
        <div class="feature-box">
          <h3>Report</h3>
          <p>Submit civic issues with photos and details</p>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="feature-box">
          <h3>Track</h3>
          <p>Monitor progress and get updates</p>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="feature-box">
          <h3>Earn Rewards</h3>
          <p>Get badges for your contributions</p>
        </div>
      </div>
    </div>
  </div>
</section>

  <div class="container text-center">

  </div>
